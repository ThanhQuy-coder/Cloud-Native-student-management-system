services:
  db_mysql:
    image: mysql:8.1
    container_name: cn_student_db
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init-microservices.sql:/docker-entrypoint-initdb.d/01-init-microservices.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cn-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cn_student_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cn-network

  auth_service:
    build:
      context: ./backend-microservices
      dockerfile: Services/AuthService/Dockerfile
    container_name: cn_auth_service
    restart: unless-stopped
    depends_on:
      db_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:80
      Database__Host: db_mysql
      Database__Port: 3306
      Database__Name: ${AUTH_DATABASE_NAME}
      Database__User: root
      Database__Password: ${MYSQL_ROOT_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Key: ${Jwt__Key}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__Exchange: ${RabbitMQ__Exchange}
      RabbitMQ__Queue: ${AUTH_RABBITMQ_QUEUE}
      RabbitMQ__RoutingKey: ${AUTH_RABBITMQ_ROUTING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "5283:80"
    networks:
      - cn-network

  student_service:
    build:
      context: ./backend-microservices
      dockerfile: Services/StudentService/Dockerfile
    container_name: cn_student_service
    restart: unless-stopped
    depends_on:
      db_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:80
      Database__Host: db_mysql
      Database__Port: 3306
      Database__Name: ${STUDENT_DATABASE_NAME}
      Database__User: root
      Database__Password: ${MYSQL_ROOT_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Key: ${Jwt__Key}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__Exchange: ${RabbitMQ__Exchange}
      RabbitMQ__Queue: ${STUDENT_RABBITMQ_QUEUE}
      RabbitMQ__RoutingKey: ${STUDENT_RABBITMQ_ROUTING_KEY}
      RabbitMQ__StudentProfileCreatedExchange: ${STUDENT_PROFILE_CREATED_EXCHANGE}
      RabbitMQ__StudentProfileCreatedRoutingKey: ${STUDENT_PROFILE_CREATED_ROUTING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "5190:80"
    networks:
      - cn-network

  academic_service:
    build:
      context: ./backend-microservices
      dockerfile: Services/AcademicService/Dockerfile
    container_name: cn_academic_service
    restart: unless-stopped
    depends_on:
      db_mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:80
      Database__Host: db_mysql
      Database__Port: 3306
      Database__Name: ${ACADEMIC_DATABASE_NAME}
      Database__User: root
      Database__Password: ${MYSQL_ROOT_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Key: ${Jwt__Key}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "5160:80"
    networks:
      - cn-network

  enrollment_service:
    build:
      context: ./backend-microservices
      dockerfile: Services/EnrollmentService/Dockerfile
    container_name: cn_enrollment_service
    restart: unless-stopped
    depends_on:
      db_mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:80
      Database__Host: db_mysql
      Database__Port: 3306
      Database__Name: ${ENROLLMENT_DATABASE_NAME}
      Database__User: root
      Database__Password: ${MYSQL_ROOT_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Key: ${Jwt__Key}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMQ__Exchange: ${RabbitMQ__Exchange}
      RabbitMQ__Queue: ${ENROLLMENT_RABBITMQ_QUEUE}
      RabbitMQ__RoutingKey: ${ENROLLMENT_RABBITMQ_ROUTING_KEY}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "5117:80"
    networks:
      - cn-network

  api_gateway:
    build:
      context: ./backend-microservices
      dockerfile: ApiGateway/Dockerfile
    container_name: cn_api_gateway
    restart: unless-stopped
    depends_on:
      - auth_service
      - student_service
      - academic_service
      - enrollment_service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:80
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    ports:
      - "7000:80"
    networks:
      - cn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cn_student_frontend
    depends_on:
      - api_gateway
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - cn-network

volumes:
  db_data:
  rabbitmq_data:

networks:
  cn-network:
    driver: bridge
